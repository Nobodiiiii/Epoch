plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = '0.3.0'
group = 'dev.epoch'
base { archivesName = 'epoch-1.18.2' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: '1.18.2' }
sourceSets.main.java.srcDir '../src/shared/java'
dependencies { minecraft 'net.minecraftforge:forge:1.18.2-40.3.12' }
tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
repositories { maven { url = uri('../.minecraft/libraries'); metadataSources { artifact() } } }
