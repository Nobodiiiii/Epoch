plugins {
 id 'java-library'
 id 'com.gtnewhorizons.retrofuturagradle' version '1.4.9'
}
version = '0.3.0'
group = 'dev.epoch'
base { archivesName = 'epoch-1.7.10' }
java.toolchain.languageVersion = JavaLanguageVersion.of(8)
minecraft { mcVersion.set('1.7.10') }
sourceSets.main.java.srcDir '../src/shared/java'
sourceSets.main.resources.srcDir '../src/shared/resources'
tasks.named('jar', Jar).configure {
 manifest { attributes 'FMLCorePlugin': 'dev.epoch.core.StreamingPlugin', 'FMLCorePluginContainsFMLMod': 'true' }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.register('testLegacy', JavaExec) {
 dependsOn 'testClasses'
 classpath = sourceSets.test.runtimeClasspath
 mainClass = 'dev.epoch.LegacyTestLauncher'
 javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
}
tasks.named('check') { dependsOn 'testLegacy' }

tasks.register('registryAudit', JavaExec) {
 dependsOn 'testClasses'
 classpath = sourceSets.test.runtimeClasspath
 mainClass = 'dev.epoch.LegacyTestLauncher'
 javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
 workingDir = layout.buildDirectory
 systemProperty 'epoch.testMain', 'dev.epoch.RegistryAudit'
 args rootProject.file('../build/compatibility').absolutePath
 if (project.hasProperty('auditAll')) args 'all'
}

tasks.register('environmentTest', JavaExec) {
 dependsOn 'testClasses'
 classpath = sourceSets.test.runtimeClasspath
 mainClass = 'dev.epoch.LegacyTestLauncher'
 javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
 workingDir = layout.buildDirectory
 systemProperty 'epoch.testMain', 'dev.epoch.EnvironmentTransferTest'
}
tasks.named('check') { dependsOn 'environmentTest' }

// Optional API, downloaded/verified by scripts/install_journeymap.py --download-only.
dependencies { compileOnly files('../build/journeymap/journeymap-forge-1.7.10-6.0.8.jar') }

tasks.register('seamlessTest', JavaExec) {
 dependsOn 'testClasses'
 classpath = sourceSets.test.runtimeClasspath
 mainClass = 'dev.epoch.LegacyTestLauncher'
 javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
 workingDir = layout.buildDirectory
 systemProperty 'epoch.testMain', 'dev.epoch.SeamlessNativeTest'
}
tasks.named('check') { dependsOn 'seamlessTest' }

tasks.register('nativeSaveQueueTest', JavaExec) {
 dependsOn 'testClasses'
 classpath = sourceSets.test.runtimeClasspath
 mainClass = 'dev.epoch.LegacyTestLauncher'
 javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
 workingDir = layout.buildDirectory
 maxHeapSize = '256m'
 systemProperty 'epoch.testMain', 'dev.epoch.NativeSaveQueueTest'
 systemProperty 'epoch.testTransform', !project.hasProperty('unboundedNativeSave')
 systemProperty 'epoch.streaming', 'true'
}
tasks.named('check') { dependsOn 'nativeSaveQueueTest' }

tasks.register('compactNativeSaveTest', JavaExec) {
 dependsOn 'testClasses'
 classpath = sourceSets.test.runtimeClasspath
 mainClass = 'dev.epoch.LegacyTestLauncher'
 javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
 workingDir = layout.buildDirectory
 maxHeapSize = '256m'
 systemProperty 'epoch.testMain', 'dev.epoch.CompactNativeSaveTest'
 systemProperty 'epoch.testTransform', 'true'
 systemProperty 'epoch.testEvents', 'true'
 systemProperty 'epoch.streaming', 'false'
}

tasks.named('check') { dependsOn 'compactNativeSaveTest' }

tasks.register('handoffFenceTest', JavaExec) {
 dependsOn 'testClasses'
 classpath = sourceSets.test.runtimeClasspath
 mainClass = 'dev.epoch.LegacyTestLauncher'
 javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
 workingDir = layout.buildDirectory
 systemProperty 'epoch.testMain', 'dev.epoch.HandoffFenceTest'
}

tasks.named('check') { dependsOn 'handoffFenceTest' }
