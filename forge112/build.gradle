plugins { id 'net.minecraftforge.gradle' version '6.0.54' }
version = '0.3.0'
group = 'dev.epoch'
base { archivesName = 'epoch-1.12.2' }
java.toolchain.languageVersion = JavaLanguageVersion.of(8)
minecraft { mappings channel: 'stable', version: '39-1.12' }
sourceSets.main.java.srcDir '../src/shared/java'
sourceSets.main.resources.srcDir '../src/shared/resources'
dependencies { minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860' }
repositories { maven { url = uri('../.minecraft/libraries'); metadataSources { artifact() } } }
tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }
tasks.named('jar', Jar).configure {
 manifest { attributes 'FMLCorePlugin': 'dev.epoch.core.StreamingPlugin', 'FMLCorePluginContainsFMLMod': 'true' }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.register('registryAudit', JavaExec) {
 dependsOn 'auditClasses'
 classpath = sourceSets.audit.runtimeClasspath
 mainClass = 'dev.epoch.RegistryAudit'
 javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
 workingDir = layout.buildDirectory
 args rootProject.file('../build/compatibility').absolutePath
 if (project.hasProperty('auditAll')) args 'all'
}

// Optional API, downloaded/verified by scripts/install_journeymap.py --download-only.
dependencies { compileOnly files('../build/journeymap/journeymap-forge-1.12.2-6.0.10.jar') }


// Registry inventory export is a read-only tooling entry point, separate from gameplay.
sourceSets {
 audit {
  java.srcDir 'src/audit/java'
  compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
  runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
 }
}
